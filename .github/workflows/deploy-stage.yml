name: Deploy to Stage

on:
  push:
    branches: [ stage ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore Entegrasyon.sln
      - run: dotnet build Entegrasyon.sln --no-restore -c Release
      - run: dotnet test Test/Entegrasyon.Test/Entegrasyon.UnitTest.csproj --no-build -c Release --verbosity minimal

  build-and-push:
    needs: unit-tests
    runs-on: [self-hosted, entegrasyon]
    steps:
      - uses: actions/checkout@v4

      - name: Build and push to local registry
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          docker build \
            -t 192.168.1.78:5252/entegrasyon-mvc:stage-${SHORT_SHA} \
            -t 192.168.1.78:5252/entegrasyon-mvc:stage \
            -f Application/Entegrasyon.MVC/Dockerfile .
          docker push 192.168.1.78:5252/entegrasyon-mvc:stage-${SHORT_SHA}
          docker push 192.168.1.78:5252/entegrasyon-mvc:stage
          echo "Pushed image with tags: stage-${SHORT_SHA}, stage"

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, entegrasyon]
    env:
      STAGE_DB_CONNECTION: ${{ secrets.STAGE_DB_CONNECTION }}
    steps:
      - uses: actions/checkout@v4

      - name: Backup stage database
        run: |
          docker exec postgres_db pg_dump -U baturhan IntegrationDb_Stage \
            | gzip > /tmp/stage-backup-$(date +%Y%m%d-%H%M%S).sql.gz
          echo "Database backup completed"
        continue-on-error: true

      - name: Run EF Core migrations
        run: |
          docker run --rm --network host \
            -e "ConnectionStrings__Main=${STAGE_DB_CONNECTION}" \
            192.168.1.78:5252/entegrasyon-mvc:stage \
            dotnet Entegrasyon.MVC.dll --migrate

      - name: Deploy staging
        run: |
          docker compose -f docker-compose.stage.yml pull
          docker compose -f docker-compose.stage.yml up -d --wait
          echo "Stage deploy completed at $(date)"
