name: Deploy to Stage

on:
  push:
    branches: [ stage ]

jobs:
  unit-tests:
    runs-on: [self-hosted, entegrasyon]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore Entegrasyon.sln
      - run: dotnet build Entegrasyon.sln --no-restore -c Release
      - run: dotnet test Test/Entegrasyon.Test/Entegrasyon.UnitTest.csproj --no-build -c Release --verbosity minimal

  build-and-push:
    needs: unit-tests
    runs-on: [self-hosted, entegrasyon]
    steps:
      - uses: actions/checkout@v4

      - name: Build and push to local registry
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          docker build \
            -t 192.168.1.78:5252/entegrasyon-blazor:stage-${SHORT_SHA} \
            -t 192.168.1.78:5252/entegrasyon-blazor:stage \
            -f Application/Entegrasyon.Blazor/Dockerfile .
          docker push 192.168.1.78:5252/entegrasyon-blazor:stage-${SHORT_SHA}
          docker push 192.168.1.78:5252/entegrasyon-blazor:stage
          echo "Pushed image with tags: stage-${SHORT_SHA}, stage"

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, entegrasyon]
    env:
      STAGE_DB_CONNECTION: ${{ secrets.STAGE_DB_CONNECTION }}
    steps:
      - uses: actions/checkout@v4

      - name: Backup stage database
        run: |
          docker exec postgres_db pg_dump -U baturhan IntegrationDb_Stage \
            | gzip > /tmp/stage-backup-$(date +%Y%m%d-%H%M%S).sql.gz
          echo "Database backup completed"
        continue-on-error: true

      - name: Run EF Core migrations
        run: |
          docker run --rm --network host \
            -e "ConnectionStrings__Main=${STAGE_DB_CONNECTION}" \
            192.168.1.78:5252/entegrasyon-blazor:stage \
            dotnet Entegrasyon.Blazor.dll --migrate

      - name: Deploy staging
        run: |
          docker compose -p stage -f docker-compose.stage.yml down --remove-orphans || true
          docker compose -p stage -f docker-compose.stage.yml pull
          docker compose -p stage -f docker-compose.stage.yml up -d --wait
          echo "Stage deploy completed at $(date)"

  e2e-tests:
    needs: deploy
    runs-on: [self-hosted, entegrasyon]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Start E2E environment
        run: |
          docker compose -p e2e -f docker-compose.e2e.yml down -v || true
          docker compose -p e2e -f docker-compose.e2e.yml up -d --build --wait
        timeout-minutes: 10

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build E2E tests
        run: dotnet build Test/Entegrasyon.E2E/Entegrasyon.E2E.csproj -c Release

      - name: Install Playwright browsers
        run: pwsh Test/Entegrasyon.E2E/bin/Release/net8.0/playwright.ps1 install --with-deps chromium

      - name: Run E2E tests
        run: dotnet test Test/Entegrasyon.E2E/Entegrasyon.E2E.csproj --no-build -c Release --verbosity normal
        env:
          E2E_BASE_URL: http://localhost:5099
          E2E_DB_CONNECTION: "Host=localhost;Port=5433;Database=IntegrationDb_E2E;Username=e2e_user;Password=e2e_password"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            Test/Entegrasyon.E2E/bin/Release/net8.0/playwright-artifacts/
            Test/Entegrasyon.E2E/TestResults/
          retention-days: 14

      - name: Cleanup E2E environment
        if: always()
        run: docker compose -p e2e -f docker-compose.e2e.yml down -v
