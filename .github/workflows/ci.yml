name: CI

on:
  push:
    branches: [ main, stage, develop ]
  pull_request:
    branches: [ main, stage ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Entegrasyon.sln

      - name: Build
        run: dotnet build Entegrasyon.sln --no-restore -c Release

      - name: Test
        run: dotnet test Test/Entegrasyon.Test/Entegrasyon.UnitTest.csproj --no-build -c Release --verbosity minimal
