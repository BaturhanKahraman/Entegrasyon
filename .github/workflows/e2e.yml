name: E2E Tests

on:
  pull_request:
    branches: [ main, stage ]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Entegrasyon.sln

      - name: Build
        run: dotnet build Entegrasyon.sln --no-restore -c Release

      - name: Run unit tests
        run: dotnet test Test/Entegrasyon.Test/Entegrasyon.UnitTest.csproj --no-build -c Release --verbosity minimal

  e2e-tests:
    needs: unit-tests
    runs-on: [self-hosted, entegrasyon]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Start E2E environment
        run: docker compose -f docker-compose.e2e.yml up -d --build --wait
        timeout-minutes: 10

      - name: Wait for app healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5099/health/live > /dev/null 2>&1; then
              echo "App is ready"
              break
            fi
            echo "Waiting for app... ($i/30)"
            sleep 5
          done

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build E2E tests
        run: dotnet build Test/Entegrasyon.E2E/Entegrasyon.E2E.csproj -c Release

      - name: Install Playwright browsers
        run: pwsh Test/Entegrasyon.E2E/bin/Release/net8.0/playwright.ps1 install --with-deps chromium

      - name: Run E2E tests
        run: dotnet test Test/Entegrasyon.E2E/Entegrasyon.E2E.csproj --no-build -c Release --verbosity normal
        env:
          E2E_BASE_URL: http://localhost:5099
          E2E_DB_CONNECTION: "Host=localhost;Port=5433;Database=IntegrationDb_E2E;Username=e2e_user;Password=e2e_password"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            Test/Entegrasyon.E2E/bin/Release/net8.0/playwright-artifacts/
            Test/Entegrasyon.E2E/TestResults/
          retention-days: 14

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
