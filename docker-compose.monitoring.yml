services:
  grafana:
    image: grafana/grafana-oss:latest
    container_name: entegrasyon-grafana
    restart: unless-stopped
    ports:
      - "3003:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    networks:
      - app-net

  loki:
    image: grafana/loki:latest
    container_name: entegrasyon-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - app-net

  tempo:
    image: grafana/tempo:2.6.1
    container_name: entegrasyon-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
      - "3200:3200"    # Tempo query API
    volumes:
      - ./monitoring/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - app-net

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: entegrasyon-uptime
    restart: unless-stopped
    ports:
      - "3004:3001"
    volumes:
      - uptime-data:/app/data
    networks:
      - app-net

volumes:
  grafana-data:
  loki-data:
  tempo-data:
  uptime-data:

networks:
  app-net:
    external: true
    name: integration_app_default
