version: '3.4'

services:
  rabbit:
    image: rabbitmq:management
    container_name: rabbitmq_container
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq/mnesia
    environment:
        - RABBITMQ_ERLANG_COOKIE=mysecretcookie
        - RABBITMQ_MANAGEMENT=true
    healthcheck:
      test: curl -f http://localhost:15672/ || exit 1
      interval: 10s
      timeout: 10s
      retries: 3
  
  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - 6379:6379
    volumes:
      - ./data:/data
  db:
    image: postgres:latest
    container_name: pg_container
    restart: always
    environment:
      POSTGRES_USER: Baturhan
      POSTGRES_PASSWORD: 649471
    ports:
      - 5432:5432
    volumes:
      - D:\TempData:/var/lib/postgresql/data
  pgadmin:
    container_name: pgadmin4_container
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    depends_on:
      - db
      
  entegrasyon.mvc:
    image: ${DOCKER_REGISTRY-}entegrasyonmvc
    build:
      context: ./
      dockerfile: Application/Entegrasyon.MVC/Dockerfile
    depends_on:
      - rabbit
      - redis
      - db
    ports:
      - "7070:8080" 
