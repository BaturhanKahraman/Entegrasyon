version: '3.4'

services:
  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - 6379:6379
    volumes:
      - ./data:/data
  db:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_PASSWORD: 649471
  rabbit:
    image: rabbitmq:latest
  entegrasyon.api:
    image: ${DOCKER_REGISTRY-}entegrasyonapi
    build:
      context: ./
      dockerfile: Application/Entegrasyon.API/Dockerfile
    depends_on:
      - redis
      - db
    
  
      