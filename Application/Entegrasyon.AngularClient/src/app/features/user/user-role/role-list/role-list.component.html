<div class="table-container">
  <button mat-raised-button color="primary" (click)="openAddDialog()">
    Rol Ekle
  </button>
  <mat-form-field appearance="standard">
    <mat-label>Arayın...</mat-label>
    <input matInput placeholder="Admin" #input />
  </mat-form-field>

  <div class="mat-elevation-z8">
    <table mat-table [dataSource]="roles$">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>Id</th>
        <td mat-cell *matCellDef="let row">{{ row.id }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>İsim</th>
        <td mat-cell *matCellDef="let row">{{ row.name }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns" ></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns" (click)="openEditDialog(row)" class="row"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="2">
          Herhangi bir sonuç bulunamadı {{ input.value }}
        </td>
      </tr>
    </table>
  </div>
</div>
