services:
  db-e2e:
    image: postgres:16-alpine
    container_name: entegrasyon-e2e-db
    environment:
      POSTGRES_USER: e2e_user
      POSTGRES_PASSWORD: e2e_password
      POSTGRES_DB: IntegrationDb_E2E
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e_user"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - e2e-net

  minio-e2e:
    image: minio/minio:latest
    container_name: entegrasyon-e2e-minio
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9099:9000"
    networks:
      - e2e-net

  blazor-e2e:
    build:
      context: .
      dockerfile: Application/Entegrasyon.Blazor/Dockerfile
    container_name: entegrasyon-e2e-app
    ports:
      - "5099:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Testing
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Main=Host=db-e2e;Port=5432;Database=IntegrationDb_E2E;Username=e2e_user;Password=e2e_password;Include Error Detail=true
      - ConnectionStrings__Redis=
      - Minio__Endpoint=minio-e2e:9000
      - Minio__AccessKey=minioadmin
      - Minio__SecretKey=minioadmin
      - Minio__UseSSL=false
      - Minio__BucketName=products-e2e
      - Minio__PublicBaseUrl=http://localhost:9099
      - JwtTokenOptions__SecurityKey=E2ETestSecurityKey_12345678!
      - ConnectionStrings__AdminPanel=Host=db-e2e;Port=5432;Database=IntegrationDb_E2E;Username=e2e_user;Password=e2e_password
      - Tenant__DefaultSubdomain=dev
      - OpenTelemetry__OtlpEndpoint=http://localhost:4317
      - Trendyol__UseMock=true
      - N11__UseMock=true
    depends_on:
      db-e2e:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - e2e-net

networks:
  e2e-net:
    driver: bridge
