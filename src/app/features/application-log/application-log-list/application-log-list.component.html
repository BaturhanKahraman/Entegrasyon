<!--ENUM SEARCH-->
<div *ngIf="isLoadingResult">
  <mat-spinner></mat-spinner>
</div>
<div class="mat-elevation-z8" *ngIf="!isLoadingResult">
  <table mat-table [dataSource]="dataSource">
    <!-- ID Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let row">{{ row.id }}</td>
    </ng-container>

    <!-- Progress Column -->
    <ng-container matColumnDef="content">
      <th mat-header-cell *matHeaderCellDef>Açıklama</th>
      <td mat-cell *matCellDef="let row">{{ row.content }}</td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="userInfos">
      <th mat-header-cell *matHeaderCellDef>Kullanıcı Bilgisi</th>
      <td mat-cell *matCellDef="let row">{{ row.userInfos }}</td>
    </ng-container>

    <!-- Fruit Column -->
    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef>Tarih</th>
      <td mat-cell *matCellDef="let row">{{ row.createdAt }}</td>
    </ng-container>

    <ng-container matColumnDef="ipAddress">
      <th mat-header-cell *matHeaderCellDef>IP Adresi</th>
      <td mat-cell *matCellDef="let row">{{ row.ipAddress }}</td>
    </ng-container>

    <ng-container matColumnDef="logAction">
      <th mat-header-cell *matHeaderCellDef>Aksiyon</th>
      <td mat-cell *matCellDef="let row">{{ LogAction[row.logAction] }}</td>
    </ng-container>
    <ng-container matColumnDef="logType">
      <th mat-header-cell *matHeaderCellDef>Tip</th>
      <td mat-cell *matCellDef="let row">{{ LogType[row.logType] }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    <!-- Row shown when there is no matching data. -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="4">Veri bulunamadı"</td>
    </tr>
  </table>

  <mat-paginator
    [pageSize]="selectedPageSize"
    [length]="totalItemCount"
    [pageSizeOptions]="[25, 50, 100, 250]"
    [showFirstLastButtons]="true"
  ></mat-paginator>
</div>
