services:
  blazor-stage:
    image: 192.168.1.78:5252/entegrasyon-blazor:stage
    container_name: entegrasyon-stage
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Staging
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Main=${STAGE_DB_CONNECTION}
      - ConnectionStrings__Redis=${REDIS_CONNECTION:-192.168.1.78:6379}
      - Minio__Endpoint=${MINIO_ENDPOINT:-192.168.1.78:9000}
      - Minio__AccessKey=${MINIO_ACCESS_KEY:-minioadmin}
      - Minio__SecretKey=${MINIO_SECRET_KEY:-minioadmin}
      - Minio__UseSSL=false
      - Minio__BucketName=products-stage
      - Minio__PublicBaseUrl=${MINIO_PUBLIC_URL:-http://192.168.1.78:9000}
      - JwtTokenOptions__SecurityKey=${JWT_SECRET_KEY:-StageSecurityKey_12345678!}
    networks:
      - app-net

networks:
  app-net:
    external: true
    name: integration_app_default
